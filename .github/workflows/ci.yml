name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Verificación de protocolos
        run: test -f README.md && test -f LICENSE && test -f .gitignore
      - name: Instalar dependencias
        run: npm ci || npm install
      - name: Lint TypeScript (tsc --noEmit)
        run: npm run lint --if-present
      - name: Tests Node (node --test)
        run: npm test --if-present
      - name: Build (vite + esbuild)
        run: npm run build --if-present
      - name: Sintaxis JS
        run: find . -name "*.js" -not -path "./node_modules/*" -not -path "./dist/*" -not -name "*.min.js" | xargs -r -n1 node --check
      - name: Compilación Python (scripts y tests)
        run: python -m compileall -q scripts tests
      - name: Tests Python (pytest)
        run: pip install pytest pytest-timeout && pytest -q --timeout=60 tests
